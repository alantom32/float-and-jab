
apiVersion: apps/v1
kind: Deployment
metadata:
  name: basic-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: basic-web
  template:
    metadata:
      labels:
        app: basic-web
    spec:
      containers:
        - name: basic-web
          image: basic-web:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 80
